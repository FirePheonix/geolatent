[metadata]
name = geolatent
version = 0.1.0
author = GeoLatent Contributors
author_email = shubhsoch@gmail.com
description = GeoLatent: geometry-aware, model-intelligent 3-D ML visualisations for Colab and Jupyter
long_description = file: README.md
long_description_content_type = text/markdown
license_expression = MIT
keywords =
    machine-learning
    visualization
    plotly
    dimensionality-reduction
    decision-boundary
    embeddings
    latent-space
    jupyter
    colab
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Science/Research
    Intended Audience :: Developers
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Topic :: Scientific/Engineering :: Artificial Intelligence
    Topic :: Scientific/Engineering :: Visualization

[options]
packages = find:
python_requires = >=3.9
install_requires =
    numpy>=1.23.0
    scipy>=1.9.0
    scikit-learn>=1.1.0
    plotly>=5.13.0

[options.extras_require]
umap =
    umap-learn>=0.5.3
export =
    kaleido>=0.2.1
dev =
    pytest>=7.0
    pytest-cov>=4.0
    black>=23.0
    ruff>=0.1.0
    mypy>=1.0

[options.package_data]
geolatent = py.typed

[tool:pytest]
testpaths = tests
addopts = --tb=short -q

[mypy]
python_version = 3.9
strict = True
ignore_missing_imports = True

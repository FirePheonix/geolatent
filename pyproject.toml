[build-system]
requires = ["setuptools>=67.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 90
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 90
select = ["E", "F", "W", "B", "I"]
ignore = ["E501"]

[tool.ruff.isort]
known-first-party = ["geolatent"]
